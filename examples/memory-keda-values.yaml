# Overlay cluster-values.yaml after installing KEDA. Replace Prometheus address/selectors.
# Keep the generated Worker Kafka lag trigger alongside memory pressure triggers.
gateway:
  autoscaling:
    mode: keda
    minReplicas: 2
    maxReplicas: 12
    keda:
      triggers:
        - type: prometheus
          metricType: Value
          metadata:
            serverAddress: http://prometheus.monitoring.svc:9090
            threshold: '0.75'
            ignoreNullValues: 'false'
            query: "(\n  sum(sink_memory_used_bytes{namespace=\"sink\",job=\"sink-gateway\",role=\"gateway\"})\n\
              \  / sum(sink_memory_watermark_bytes{namespace=\"sink\",job=\"sink-gateway\",role=\"gateway\",watermark=\"\
              high\"})\n) and on() (min(up{namespace=\"sink\",job=\"sink-gateway\"}) == 1) and on() (count(sink_memory_watermark_bytes{namespace=\"\
              sink\",job=\"sink-gateway\",role=\"gateway\",watermark=\"high\"})\n          == count(up{namespace=\"\
              sink\",job=\"sink-gateway\"}))"
        - type: prometheus
          metricType: Value
          metadata:
            serverAddress: http://prometheus.monitoring.svc:9090
            threshold: '0.02'
            ignoreNullValues: 'false'
            query: "(\n  sum(rate(sink_memory_rejected_total{namespace=\"sink\",job=\"sink-gateway\",role=\"gateway\"\
              }[1m]))\n  / clamp_min(\n    sum(rate(sink_memory_admitted_total{namespace=\"sink\",job=\"sink-gateway\"\
              ,role=\"gateway\"}[1m]))\n    + sum(rate(sink_memory_rejected_total{namespace=\"sink\",job=\"sink-gateway\"\
              ,role=\"gateway\"}[1m])), 1)\n) and on() (min(up{namespace=\"sink\",job=\"sink-gateway\"}) == 1)"
  config:
    memory:
      highWatermarkPercent: 80
      lowWatermarkPercent: 70
