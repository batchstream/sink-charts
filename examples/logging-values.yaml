# Overlay cluster-values.yaml. Replace Collector endpoint and deployment labels.
# TLS defaults to enabled. includeFailureBody may include document content.
gateway:
  config:
    logging:
      level: warn
      console:
        enabled: true
        format: text
      labels:
        environment: production
        cluster: example-cluster
      includeFailureBody: false
      maxBodyBytes: 16KiB
      otlp:
        enabled: true
        protocol: grpc
        endpoint: otel-collector.observability.svc.cluster.local:4317
        tls:
          enabled: true
        queueSize: 1024
        batchSize: 128
        flushInterval: 1s
        exportTimeout: 3s
        shutdownTimeout: 5s
