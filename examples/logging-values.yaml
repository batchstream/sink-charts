# Overlay on cluster-values.yaml; replace the example Collector and labels.
# Sink 0.18+ only. Empty runtime.logging preserves Sink defaults on older images.
gateway:
  runtime:
    logging: &logging
      level: warn
      components: {runtime: info}
      console: {enabled: true, format: json}
      labels: {environment: production, cluster: example-cluster}
      failure_body: false
      max_body_bytes: 16KiB
      otlp:
        enabled: true
        protocol: grpc
        endpoint: otel-collector.observability.svc.cluster.local:4317
        tls: {enabled: true}
        queue_size: 1024
        batch_size: 128
        flush_interval: 1s
        export_timeout: 3s
        shutdown_timeout: 5s
engineDefaults:
  runtime:
    logging: *logging
workerDefaults:
  runtime:
    logging: *logging
stores:
  mongo:
    worker:
      runtime:
        logging:
          components: {kafka: info}
