# Search Store examples. Provision referenced credential keys externally.
stores:
  catalog:
    phase: active
    storage:
      driver: opensearch
      search:
        endpoints:
          - https://opensearch.example.invalid:9200
        usernameSecretRef:
          name: catalog-auth-v1
          key: username
        passwordSecretRef:
          name: catalog-auth-v1
          key: password
  events:
    phase: active
    storage:
      driver: elasticsearch
      search:
        endpoints:
          - https://elasticsearch.example.invalid:9200
        apiKeySecretRef:
          name: events-auth-v1
          key: api-key
