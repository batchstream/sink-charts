# Complete external Secret payload; replace addresses before use.
mode: engine
grpc: {address: ":8080"}
health: {address: ":8081"}
prometheus: {enabled: false, address: ":9090"}
service:
  request: {timeout: 30s}
storage:
  name: mongo
  driver: mongodb
  mongodb:
    uri: mongodb://mongodb.example.invalid:27017/?replicaSet=rs0
  kafka:
    enabled: true
    brokers: [kafka.example.invalid:9092]
    topic:
      name: mongo-mutations-v1
      partitions: 8
      replication_factor: 3
      min_insync_replicas: 2
    consumer: {group_id: mongo-workers-v1}
shutdown_timeout: 30s
