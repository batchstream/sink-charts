# Overlay cluster-values.yaml after installing KEDA. Scale Workers on Kafka lag.
stores:
  mongo:
    worker:
      autoscaling:
        mode: keda
        minReplicas: 0
        maxReplicas: 8
        keda:
          pollingInterval: 15
          cooldownPeriod: 300
          initialCooldownPeriod: 60
          kafkaLag:
            name: mongo-lag
            useCachedMetrics: true
            targetLag: 1000 # Records per Worker.
            # authenticationRef: {name: kafka-scaler-auth}
          fallback:
            failureThreshold: 3
            replicas: 2
            behavior: currentReplicasIfHigher
          triggers:
            - type: cron
              metadata:
                timezone: UTC
                start: 0 8 * * 1-5
                end: 0 18 * * 1-5
                desiredReplicas: '2'
        allowScaleToZero: true
      podDisruptionBudget:
        enabled: false
