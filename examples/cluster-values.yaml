# Active MongoDB Store plus staged archive. HPA requires metrics-server.
gateway:
  autoscaling:
    mode: hpa
    minReplicas: 2
    maxReplicas: 6
stores:
  mongo:
    phase: active
    storage:
      driver: mongodb
      mongodb:
        uriSecretRef:
          name: sink-mongo-v1
          key: uri
    kafka:
      brokers:
        - kafka.example.invalid:9092
      topic:
        name: mongo-mutations-v1
      topicPolicy:
        partitions: 8
    engine:
      pod:
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            memory: 2Gi
      autoscaling:
        mode: hpa
        minReplicas: 2
        maxReplicas: 8
    worker:
      enabled: true
      config:
        kafkaConsumer:
          groupId: mongo-workers-v1
      pod:
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 1Gi
      autoscaling:
        mode: hpa
        minReplicas: 2
        maxReplicas: 4
  archive:
    phase: staged
    storage:
      driver: mongodb
      mongodb:
        uriSecretRef:
          name: sink-archive-v1
          key: uri
    engine:
      pod:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
