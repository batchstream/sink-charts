# Store credentials are externally managed Secrets in the release namespace.
gateway:
  autoscaling:
    mode: hpa
    minReplicas: 2
    maxReplicas: 6
stores:
  mongo:
    state: active
    engine:
      pod:
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            memory: 2Gi
      autoscaling:
        mode: hpa
        minReplicas: 2
        maxReplicas: 8
    worker:
      enabled: true
      runtime:
        consumer:
          group_id: mongo-workers-v1
      pod:
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 1Gi
      autoscaling:
        mode: hpa
        minReplicas: 2
        maxReplicas: 4
    kafka:
      brokers:
      - kafka.example.invalid:9092
      topic: mongo-mutations-v1
      partitions: 8
      lagThreshold: 1000
    # Same credential projection and backend settings for both roles.
    storage:
      driver: mongodb
      mongodb:
        uriSecretRef:
          name: sink-mongo-v1
          key: uri
  archive:
    # Activate in a separate upgrade after backend checks and Engine availability.
    state: staged
    engine:
      pod:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
    # Same credential projection and backend settings for both roles.
    storage:
      driver: mongodb
      mongodb:
        uriSecretRef:
          name: sink-archive-v1
          key: uri
