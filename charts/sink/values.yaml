# One release manages a Gateway and independently scaled Engines/Workers per Store.
nameOverride: ""
fullnameOverride: ""
clusterDomain: cluster.local
image:
  # Requires the role-config release; override with a candidate image for pre-release testing.
  repository: ghcr.io/batchstream/sink
  tag: "0.19.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Integer seconds make the relationship between discovery and termination explicit.
# These are conservative assumptions, not measurements of your cluster.
discovery:
  dnsRefreshSeconds: 10
  endpointPublicationSeconds: 5
  dnsCacheSeconds: 30
  lookupBackoffSeconds: 10
  safetyMarginSeconds: 10
  # Includes client DNS, load balancer, proxy and EndpointSlice propagation.
  clientWithdrawalSeconds: 60

lifecycle:
  # Live Helm upgrades use the inventory ConfigMap and Pod/Deployment metadata.
  # helm template cannot perform these checks; see the GitOps runbook.
  enforceTransitions: true
  # Explicit operator confirmation after stopping writers and draining Kafka/DLQ.
  removalApprovals: []

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s

# No cluster-wide controllers or backend databases are installed by this chart.
gateway:
  image: {} # Overrides global image; roll Engines before advancing the Gateway.
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
    # Stable Pod-address discovery for gRPC clients using dns:/// and round_robin.
    # The name is <Helm release>-sink-gateway-headless and excludes the chart version.
    headless:
      enabled: true
      annotations: {}
  runtime:
    # Additional runtime tuning; managed routing/listeners cannot be overridden.
    logging: {} # Sink 0.18+: level, components, console, labels, failure_body, max_body_bytes, otlp.
    memory: {} # Omit to auto-detect capacity; new memory-admission Sink builds only.
    forwarding: {}
    request: {}
    grpc: {}
  pod:
    configRevision: ""
    annotations: {}
    labels: {}
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {memory: 512Mi}
    goMemoryLimitPercent: 80
    env: []
    envFrom: []
    minReadySeconds: 10
    shutdownTimeoutSeconds: 30
    # Whole SIGTERM-to-exit budget, including sequential shutdown phases.
    shutdownBudgetSeconds: 150
    preStopSeconds: null # null derives the minimum; smaller overrides fail.
    terminationGracePeriodSeconds: null # null derives preStop + shutdown + margin.
    serviceAccountAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: [] # Empty enables soft node/zone spread.
    priorityClassName: ""
  autoscaling:
    mode: none # none | hpa | keda; exactly one controller owns replicas.
    minReplicas: 2
    maxReplicas: 6
    cpuUtilization: 70
    memoryUtilization: 0
    extraMetrics: []
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - {type: Percent, value: 100, periodSeconds: 60}
          - {type: Pods, value: 2, periodSeconds: 60}
      scaleDown:
        stabilizationWindowSeconds: 300
        selectPolicy: Min
        policies:
          - {type: Pods, value: 1, periodSeconds: 300}
    keda:
      pollingInterval: 30
      cooldownPeriod: 300
      initialCooldownPeriod: 0
      annotations: {}
      hpaName: ""
      restoreToOriginalReplicaCount: false
      triggers: [] # Empty uses CPU for Gateway/Engine; Worker uses its Kafka topic.
      authenticationRef: {}
      fallback: {} # Optional {failureThreshold: 3, replicas: 2, behavior: currentReplicasIfHigher}.
      kafkaTrigger: {name: kafka-lag, useCachedMetrics: true}
  disruptionBudget:
    enabled: true
    maxUnavailable: 1

# Stores inherit these defaults. Every nested field can be overridden per Store.
engineDefaults:
  image: {} # Per-Store engine.image overrides these fields.
  replicaCount: 2
  # Inherit Sink defaults: batching max_operations=32, max_wait=2ms; memory burst_percent=10.
  runtime: {logging: {}, memory: {}, execution: {}, batching: {}, producer: {}, grpc: {}} # Per-Engine tuning.
  readiness: storage # storage | kafka | process; do not combine dependency restarts with liveness.
  pod:
    configRevision: "" # Bump to reload an in-place Secret change; prefer versioned Secret names.
    annotations: {}
    labels: {}
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {memory: 1Gi}
    goMemoryLimitPercent: 80
    env: []
    envFrom: []
    minReadySeconds: 10 # Effective minimum also covers discovery convergence.
    shutdownTimeoutSeconds: 30 # Generated into the runtime configuration.
    shutdownBudgetSeconds: 150
    preStopSeconds: null
    terminationGracePeriodSeconds: null
    serviceAccountAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    priorityClassName: ""
  autoscaling:
    mode: none
    minReplicas: 2
    maxReplicas: 6
    cpuUtilization: 70
    memoryUtilization: 0
    extraMetrics: []
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - {type: Percent, value: 100, periodSeconds: 60}
          - {type: Pods, value: 2, periodSeconds: 60}
      scaleDown:
        stabilizationWindowSeconds: 300
        selectPolicy: Min
        policies:
          - {type: Pods, value: 1, periodSeconds: 300}
    keda:
      pollingInterval: 30
      cooldownPeriod: 300
      initialCooldownPeriod: 0
      annotations: {}
      hpaName: ""
      restoreToOriginalReplicaCount: false
      triggers: []
      authenticationRef: {}
      fallback: {}
      kafkaTrigger: {name: kafka-lag, useCachedMetrics: true}
  disruptionBudget: {enabled: true, maxUnavailable: 1}

workerDefaults:
  image: {} # Per-Store worker.image overrides these fields.
  enabled: false # Enable together with the Store's Kafka settings.
  replicaCount: 2
  allowScaleToZero: false # Explicitly accept delayed application while scaled to zero.
  runtime: {logging: {}, memory: {}, execution: {}, consumer: {}}
  pod:
    configRevision: ""
    annotations: {}
    labels: {}
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {memory: 1Gi}
    goMemoryLimitPercent: 80
    env: []
    envFrom: []
    minReadySeconds: 10
    shutdownTimeoutSeconds: 30
    shutdownBudgetSeconds: 150
    preStopSeconds: null # Workers leave the consumer group promptly; default 0.
    terminationGracePeriodSeconds: null
    serviceAccountAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    priorityClassName: ""
  autoscaling:
    mode: none
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 70
    memoryUtilization: 0
    extraMetrics: []
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - {type: Percent, value: 100, periodSeconds: 60}
          - {type: Pods, value: 2, periodSeconds: 60}
      scaleDown:
        stabilizationWindowSeconds: 300
        selectPolicy: Min
        policies:
          - {type: Pods, value: 1, periodSeconds: 300}
    keda:
      pollingInterval: 30
      cooldownPeriod: 300
      initialCooldownPeriod: 0
      annotations: {}
      hpaName: ""
      restoreToOriginalReplicaCount: false
      triggers: []
      authenticationRef: {}
      fallback: {}
      kafkaTrigger: {name: kafka-lag, useCachedMetrics: true}
  disruptionBudget: {enabled: true, maxUnavailable: 1}

# Store keys are stable Sink identities, not array positions. See examples/cluster-values.yaml.
# Lifecycle: staged (backends only) -> active (routed) -> retiring (unrouted, retained) -> remove.
# Do not rename Store keys, Kafka topics/groups or backend targets in place.
# Example:
# stores:
#   orders:
#     state: staged
#     storage:
#       driver: mongodb
#       mongodb:
#         uriSecretRef: {name: orders-mongo-v1, key: uri}
#         metadataField: __sink
#     credentialRevision: "" # Roll both roles after an in-place Secret update.
#     engine: {runtime: {execution: {mongodb: {max_concurrent_writes: 64}}}}
#     worker: {enabled: false}
# Add kafka metadata to enable async delivery; defaults: replicationFactor=3,
# minInSyncReplicas=1. kafka.runtime carries additional nonsecret Kafka tuning.
stores: {}
