# One release manages a Gateway and independently scaled Engines/Workers per Store.
nameOverride: ""
fullnameOverride: ""
clusterDomain: cluster.local
image:
  # Verified 0.15.0 registry location predates the organization transfer.
  repository: ghcr.io/liran/sink
  tag: "0.15.0"
  digest: sha256:b240d56f3df686e9e42d863deb7ac7f52bddf321397b43ba919f665ddfbf21a7
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Integer seconds make the relationship between discovery and termination explicit.
# These are conservative assumptions, not measurements of your cluster.
discovery:
  dnsRefreshSeconds: 10
  endpointPublicationSeconds: 5
  dnsCacheSeconds: 30
  lookupBackoffSeconds: 10
  safetyMarginSeconds: 10
  # Includes client DNS, load balancer, proxy and EndpointSlice propagation.
  clientWithdrawalSeconds: 60
requestTimeoutSeconds: 30

lifecycle:
  # Live Helm upgrades use the inventory ConfigMap and Pod/Deployment metadata.
  # helm template cannot perform these checks; see the GitOps runbook.
  enforceTransitions: true
  # Explicit operator confirmation after stopping writers and draining Kafka/DLQ.
  removalApprovals: []

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s

# No cluster-wide controllers or backend databases are installed by this chart.
gateway:
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  runtime:
    # Additional gateway/service/grpc tuning; managed routing/listeners cannot be overridden.
    gateway: {}
    service: {}
    grpc: {}
  pod:
    configRevision: ""
    annotations: {}
    labels: {}
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {memory: 512Mi}
    goMemoryLimitPercent: 80
    env: []
    envFrom: []
    minReadySeconds: 10
    shutdownTimeoutSeconds: 30
    # Whole SIGTERM-to-exit budget, including sequential shutdown phases.
    shutdownBudgetSeconds: 150
    preStopSeconds: null # null derives the minimum; smaller overrides fail.
    terminationGracePeriodSeconds: null # null derives preStop + shutdown + margin.
    serviceAccountAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: [] # Empty enables soft node/zone spread.
    priorityClassName: ""
  autoscaling:
    mode: none # none | hpa | keda; exactly one controller owns replicas.
    minReplicas: 2
    maxReplicas: 6
    cpuUtilization: 70
    memoryUtilization: 0
    extraMetrics: []
    scaleDown:
      stabilizationWindowSeconds: 300
      periodSeconds: 300
      pods: 1
    keda:
      pollingInterval: 30
      cooldownPeriod: 300
      triggers: [] # Empty uses CPU for Gateway/Engine; Worker uses its Kafka topic.
      authenticationRef: {}
      fallback: {} # Optional {failureThreshold: 3, replicas: 2}; AverageValue triggers only.
  disruptionBudget:
    enabled: true
    maxUnavailable: 1

# Stores inherit these defaults. Every nested field can be overridden per Store.
engineDefaults:
  replicaCount: 2
  config:
    existingSecret: "" # Default: <component name>-config; key contains complete Sink YAML.
    key: sink.yaml
  readiness: storage # storage | kafka | process; do not combine dependency restarts with liveness.
  pod:
    configRevision: "" # Bump when externally managed configuration changes.
    annotations: {}
    labels: {}
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {memory: 1Gi}
    goMemoryLimitPercent: 80
    env: []
    envFrom: []
    minReadySeconds: 10 # Effective minimum also covers discovery convergence.
    shutdownTimeoutSeconds: 30 # Must match the external configuration.
    shutdownBudgetSeconds: 150
    preStopSeconds: null
    terminationGracePeriodSeconds: null
    serviceAccountAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    priorityClassName: ""
  autoscaling:
    mode: none
    minReplicas: 2
    maxReplicas: 6
    cpuUtilization: 70
    memoryUtilization: 0
    extraMetrics: []
    scaleDown: {stabilizationWindowSeconds: 300, periodSeconds: 300, pods: 1}
    keda: {pollingInterval: 30, cooldownPeriod: 300, triggers: [], authenticationRef: {}, fallback: {}}
  disruptionBudget: {enabled: true, maxUnavailable: 1}

workerDefaults:
  enabled: false # Enable together with the Store's Kafka settings.
  replicaCount: 2
  allowScaleToZero: false # Explicitly accept delayed application while scaled to zero.
  config: {existingSecret: "", key: sink.yaml}
  pod:
    configRevision: ""
    annotations: {}
    labels: {}
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {memory: 1Gi}
    goMemoryLimitPercent: 80
    env: []
    envFrom: []
    minReadySeconds: 10
    shutdownTimeoutSeconds: 30
    shutdownBudgetSeconds: 150
    preStopSeconds: null # Workers leave the consumer group promptly; default 0.
    terminationGracePeriodSeconds: null
    serviceAccountAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    priorityClassName: ""
  autoscaling:
    mode: none
    minReplicas: 2
    maxReplicas: 4
    cpuUtilization: 70
    memoryUtilization: 0
    extraMetrics: []
    scaleDown: {stabilizationWindowSeconds: 300, periodSeconds: 300, pods: 1}
    keda: {pollingInterval: 30, cooldownPeriod: 300, triggers: [], authenticationRef: {}, fallback: {}}
  disruptionBudget: {enabled: true, maxUnavailable: 1}

# Store keys are stable Sink identities, not array positions. See examples/cluster-values.yaml.
# Lifecycle: staged (backends only) -> active (routed) -> retiring (unrouted, retained) -> remove.
# Do not rename Store keys, Kafka topics/groups or backend targets in place.
stores: {}
