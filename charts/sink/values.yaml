# Values are the only configuration source. The chart generates Sink YAML.
# Chart keys use camelCase; durations use strings such as 2ms and 30s.
# Byte limits accept integer bytes or KiB/MiB/GiB; Pod memory uses Ki/Mi/Gi.
# Empty config maps inherit Sink defaults. No backend or controller is installed.

nameOverride: ''
fullnameOverride: ''

# One shared image and registry configuration for every Gateway, Engine and Worker.
image:
  repository: ghcr.io/batchstream/sink
  tag: 0.22.0
  digest: ''
  pullPolicy: IfNotPresent
  pullSecrets: []

# Cluster-wide DNS assumptions and Store lifecycle checks.
cluster:
  domain: cluster.local
  discovery:
    dnsRefreshSeconds: 10
    endpointPropagationSeconds: 5
    dnsCacheTTLSeconds: 30
    dnsRetryBackoffSeconds: 10
    safetyMarginSeconds: 10
    clientEndpointRemovalSeconds: 60
  storeLifecycle:
    enforceTransitions: true
    removalApprovals: [] # Store names approved for removal after writers/Kafka/DLQ drain.

# Metrics listeners and optional Prometheus Operator discovery.
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    scrapeTimeout: 10s

# Shared public gRPC entry point. Created when at least one Store is active.
gateway:
  replicas: 2
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
    headless:
      enabled: true
      annotations: {}
  # Application settings; listeners, routes and identity are generated.
  config:
    logging: {}
    memory: {}
    forwarding: {}
    requestLimits: {}
    grpc: {}
  # Container resources, environment, labels and scheduling.
  pod:
    annotations: {}
    labels: {}
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
    goMemoryLimitPercent: 80 # GOMEMLIMIT as a percentage of the Pod memory limit.
    env: []
    envFrom: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: [] # Empty enables soft node/zone spread.
    priorityClassName: ''
  serviceAccount:
    annotations: {}
  # Readiness and bounded graceful termination; budgets are seconds.
  rollout:
    minReadySeconds: 10
    shutdownTimeoutSeconds: 30 # Timeout for each application shutdown phase.
    shutdownBudgetSeconds: 150 # Total SIGTERM-to-exit budget, including OTLP flush.
    preStopDelaySeconds: null # null derives the minimum delay from cluster.discovery.
    terminationGracePeriodSeconds: null # null derives preStop + shutdown budget + margin.
    restartRevision: '' # Change to force a restart when mounted data changes in place.
  # mode: none | hpa | keda. Only the selected controller manages replicas.
  autoscaling:
    mode: none
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercent: 70
    targetMemoryUtilizationPercent: 0
    extraMetrics: []
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 2
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        selectPolicy: Min
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300
    keda:
      pollingInterval: 30
      cooldownPeriod: 300
      initialCooldownPeriod: 0
      annotations: {}
      hpaName: ''
      restoreToOriginalReplicaCount: false
      triggers: []
      fallback: {}
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

# Per-role defaults. stores.<name>.engine/worker recursively override their own role.
defaults:
  engine:
    replicas: 2
    # Application settings; listeners, routes and identity are generated.
    config:
      logging: {}
      memory: {}
      batching: {}
      executionQueue: {} # Unified ready-task count and Store-wide waiting bytes.
      kafkaProducer: {}
      grpc: {}
    # Container resources, environment, labels and scheduling.
    pod:
      annotations: {}
      labels: {}
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          memory: 1Gi
      goMemoryLimitPercent: 80 # GOMEMLIMIT as a percentage of the Pod memory limit.
      env: []
      envFrom: []
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: [] # Empty enables soft node/zone spread.
      priorityClassName: ''
    serviceAccount:
      annotations: {}
    # Readiness and bounded graceful termination; budgets are seconds.
    rollout:
      minReadySeconds: 10
      shutdownTimeoutSeconds: 30 # Timeout for each application shutdown phase.
      shutdownBudgetSeconds: 150 # Total SIGTERM-to-exit budget, including OTLP flush.
      preStopDelaySeconds: null # null derives the minimum delay from cluster.discovery.
      terminationGracePeriodSeconds: null # null derives preStop + shutdown budget + margin.
      restartRevision: '' # Change to force a restart when mounted data changes in place.
      readinessCheck: storage # storage | kafka | process; Engine only.
    # mode: none | hpa | keda. Only the selected controller manages replicas.
    autoscaling:
      mode: none
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercent: 70
      targetMemoryUtilizationPercent: 0
      extraMetrics: []
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
            - type: Pods
              value: 2
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Min
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300
      keda:
        pollingInterval: 30
        cooldownPeriod: 300
        initialCooldownPeriod: 0
        annotations: {}
        hpaName: ''
        restoreToOriginalReplicaCount: false
        triggers: []
        fallback: {}
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
  worker:
    enabled: false
    replicas: 2
    # Application settings; listeners, routes and identity are generated.
    config:
      logging: {}
      memory: {}
      kafkaConsumer: {}
    # Container resources, environment, labels and scheduling.
    pod:
      annotations: {}
      labels: {}
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          memory: 1Gi
      goMemoryLimitPercent: 80 # GOMEMLIMIT as a percentage of the Pod memory limit.
      env: []
      envFrom: []
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: [] # Empty enables soft node/zone spread.
      priorityClassName: ''
    serviceAccount:
      annotations: {}
    # Readiness and bounded graceful termination; budgets are seconds.
    rollout:
      minReadySeconds: 10
      shutdownTimeoutSeconds: 30 # Timeout for each application shutdown phase.
      shutdownBudgetSeconds: 150 # Total SIGTERM-to-exit budget, including OTLP flush.
      preStopDelaySeconds: null # null derives the minimum delay from cluster.discovery.
      terminationGracePeriodSeconds: null # null derives preStop + shutdown budget + margin.
      restartRevision: '' # Change to force a restart when mounted data changes in place.
    # mode: none | hpa | keda. Only the selected controller manages replicas.
    autoscaling:
      mode: none
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercent: 70
      targetMemoryUtilizationPercent: 0
      extraMetrics: []
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
            - type: Pods
              value: 2
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Min
          policies:
            - type: Pods
              value: 1
              periodSeconds: 300
      keda:
        pollingInterval: 30
        cooldownPeriod: 300
        initialCooldownPeriod: 0
        annotations: {}
        hpaName: ''
        restoreToOriginalReplicaCount: false
        triggers: []
        fallback: {}
        kafkaLag:
          name: kafka-lag
          useCachedMetrics: true
          authenticationRef: {}
          targetLag: 1000 # Unprocessed records per Worker for the generated Kafka scaler.
      allowScaleToZero: false # Worker only; permits delayed processing at zero replicas.
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

# Stable Store identities; clients select these names. Start additions as staged.
# Each Store requires phase (staged | active | retiring) and storage.
# Example:
# stores:
#   orders:
#     phase: staged
#     maxConcurrent: 64 # Optional per-process Store ceiling; Search defaults to 128.
#     storage:
#       driver: mongodb
#       mongodb:
#         uriSecretRef: {name: orders-mongo-v1, key: uri}
#     kafka:
#       brokers: [kafka:9092]
#       topic: {name: orders-mutations, retention: 72h}
#       deadLetterTopic: {name: orders-rejected, retention: 720h}
#       topicPolicy: {partitions: 8, replicationFactor: 3, minInSyncReplicas: 1}
#     worker:
#       enabled: true
#       config:
#         kafkaConsumer: {groupId: orders-workers}
# See the packaged README for all fields and examples/ for complete overlays.
stores: {}
