{{- if and (eq .Values.mode "engine") (ne .Values.service.type "ClusterIP") -}}
{{- fail "Engine discovery requires service.type=ClusterIP (headless)" -}}
{{- end -}}
{{- if and (eq .Values.mode "engine") (ne (int .Values.service.port) (int .Values.ports.grpc)) -}}
{{- fail "Engine headless discovery requires service.port to equal ports.grpc" -}}
{{- end -}}
{{- if or (ne .Values.mode "worker") .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sink.fullname" . }}
  labels:
    {{- include "sink.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if eq .Values.mode "engine" }}
  type: ClusterIP
  clusterIP: None
  {{- else if eq .Values.mode "worker" }}
  type: ClusterIP
  {{- else }}
  type: {{ .Values.service.type }}
  {{- end }}
  selector:
    {{- include "sink.selectorLabels" . | nindent 4 }}
  ports:
    {{- if ne .Values.mode "worker" }}
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
    {{- end }}
{{- end }}
