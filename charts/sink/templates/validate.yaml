{{- if and .Values.metrics.serviceMonitor.enabled (not .Values.metrics.enabled) -}}{{- fail "serviceMonitor requires metrics.enabled" -}}{{- end -}}
{{- if and .Values.metrics.serviceMonitor.enabled (not (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor")) -}}{{- fail "install the ServiceMonitor CRD before enabling serviceMonitor" -}}{{- end -}}
{{- range $component := include "sink.components" . | fromJsonArray -}}
{{- $c := merge (dict "root" $) $component -}}
{{- $s := $c.settings -}}{{- $a := $s.autoscaling -}}
{{- $minimum := int $s.replicaCount -}}
{{- if ne $a.mode "none" -}}{{- $minimum = int $a.minReplicas -}}{{- end -}}
{{- $floor := 2 -}}
{{- if eq $c.role "engine" -}}{{- $floor = 1 -}}{{- end -}}
{{- if eq $c.role "worker" -}}{{- $floor = 1 -}}{{- if $s.allowScaleToZero -}}{{- $floor = 0 -}}{{- end -}}{{- end -}}
{{- if lt $minimum $floor -}}{{- fail (printf "%s/%s requires at least %d replicas" $c.role $c.store $floor) -}}{{- end -}}
{{- if and (eq $minimum 0) $s.disruptionBudget.enabled -}}{{- fail "disable the Worker disruptionBudget when allowing zero replicas" -}}{{- end -}}
{{- if and (ne $a.mode "none") (lt (int $a.maxReplicas) $minimum) -}}{{- fail "maxReplicas must cover minReplicas" -}}{{- end -}}
{{- if and (eq $a.mode "hpa") (eq $minimum 0) -}}{{- fail "scale to zero requires KEDA or manual replicas" -}}{{- end -}}
{{- if and $s.disruptionBudget.enabled (ge (int $s.disruptionBudget.maxUnavailable) $minimum) -}}{{- fail "disruptionBudget.maxUnavailable must be less than minimum replicas" -}}{{- end -}}
{{- $grace := include "sink.grace" $c | int -}}
{{- if lt (int $s.pod.shutdownBudgetSeconds) (mul 4 $s.pod.shutdownTimeoutSeconds | int) -}}{{- fail "shutdownBudgetSeconds must cover at least four sequential shutdown timeouts" -}}{{- end -}}
{{- if and (eq $c.role "gateway") (lt (int $s.pod.shutdownTimeoutSeconds) (int $.Values.requestTimeoutSeconds)) -}}{{- fail "Gateway shutdownTimeoutSeconds must cover requestTimeoutSeconds" -}}{{- end -}}
{{- if ne $a.mode "none" -}}
{{- range $policy := $a.behavior.scaleDown.policies -}}{{- if lt (int $policy.periodSeconds) $grace -}}{{- fail (printf "%s/%s scaleDown policy periodSeconds must cover termination grace (%d)" $c.role $c.store $grace) -}}{{- end -}}{{- end -}}
{{- end -}}
{{- if and (eq $a.mode "hpa") (not (or (gt (int $a.cpuUtilization) 0) (gt (int $a.memoryUtilization) 0) (gt (len $a.extraMetrics) 0))) -}}{{- fail "HPA requires at least one metric" -}}{{- end -}}
{{- if and (eq $a.mode "keda") (not ($.Capabilities.APIVersions.Has "keda.sh/v1alpha1/ScaledObject")) -}}{{- fail "install KEDA before selecting autoscaling.mode=keda" -}}{{- end -}}
{{- if and (eq $a.mode "keda") (ne $c.role "worker") (eq (len $a.keda.triggers) 0) (le (int $a.cpuUtilization) 0) -}}{{- fail "default KEDA CPU trigger requires positive cpuUtilization" -}}{{- end -}}
{{- if and (eq $a.mode "keda") $a.keda.fallback -}}
{{- $fallbackCapable := eq $c.role "worker" -}}
{{- range $trigger := $a.keda.triggers -}}{{- if and (not (has $trigger.type (list "cpu" "memory"))) (has (default "AverageValue" $trigger.metricType) (list "AverageValue" "Value")) -}}{{- $fallbackCapable = true -}}{{- end -}}{{- end -}}
{{- if not $fallbackCapable -}}{{- fail "KEDA fallback requires at least one Value/AverageValue trigger other than CPU or memory" -}}{{- end -}}
{{- if or (lt (int $a.keda.fallback.replicas) $minimum) (gt (int $a.keda.fallback.replicas) (int $a.maxReplicas)) -}}{{- fail "KEDA fallback replicas must be within the scaling range" -}}{{- end -}}
{{- end -}}
{{- if eq $c.role "worker" -}}
{{- if not (and $c.kafka.brokers $c.kafka.topic $c.kafka.consumerGroup $c.kafka.partitions) -}}{{- fail (printf "Store %s Worker requires kafka brokers, topic, consumerGroup and partitions" $c.store) -}}{{- end -}}
{{- $max := int $s.replicaCount -}}{{- if ne $a.mode "none" -}}{{- $max = int $a.maxReplicas -}}{{- end -}}
{{- if gt $max (int $c.kafka.partitions) -}}{{- fail (printf "Store %s Worker maximum replicas exceeds Kafka partitions" $c.store) -}}{{- end -}}
{{- end -}}
{{- $cpuRequest := include "sink.cpuMillis" $s.pod.resources.requests.cpu | float64 -}}
{{- if le $cpuRequest 0.0 -}}{{- fail "CPU request must be positive" -}}{{- end -}}
{{- if hasKey $s.pod.resources.limits "cpu" -}}
{{- if lt (include "sink.cpuMillis" $s.pod.resources.limits.cpu | float64) $cpuRequest -}}{{- fail "CPU request exceeds limit" -}}{{- end -}}
{{- end -}}
{{- $limit := include "sink.memoryBytes" $s.pod.resources.limits.memory | int64 -}}
{{- $request := include "sink.memoryBytes" $s.pod.resources.requests.memory | int64 -}}
{{- if gt $request $limit -}}{{- fail "memory request exceeds limit" -}}{{- end -}}
{{- range $env := $s.pod.env -}}{{- if eq $env.name "GOMEMLIMIT" -}}{{- fail "set pod.goMemoryLimitPercent instead of overriding GOMEMLIMIT" -}}{{- end -}}{{- end -}}
{{- range $key, $_ := $s.pod.labels -}}{{- if or (hasPrefix "app.kubernetes.io/" $key) (hasPrefix "sink.batchstream.io/" $key) (eq $key "helm.sh/chart") -}}{{- fail "pod.labels cannot override chart identity labels" -}}{{- end -}}{{- end -}}
{{- range $key, $_ := $s.pod.annotations -}}{{- if hasPrefix "sink.batchstream.io/" $key -}}{{- fail "pod.annotations cannot override chart configuration annotations" -}}{{- end -}}{{- end -}}
{{- end -}}
{{- if or (hasKey .Values.gateway.runtime.gateway "routes") (hasKey .Values.gateway.runtime.gateway "dns_refresh_interval") (hasKey .Values.gateway.runtime.grpc "address") (hasKey (default dict .Values.gateway.runtime.service.request) "timeout") -}}{{- fail "Gateway routes, DNS refresh, listeners and request timeout are chart-managed" -}}{{- end -}}
{{- range $store, $settings := .Values.stores -}}
{{- if ne $settings.storage.driver "mongodb" -}}
{{- $s := $settings.storage.search -}}
{{- range $endpoint := $s.endpoints -}}
{{- if regexMatch "^[A-Za-z][A-Za-z0-9+.-]*://[^/?#]*@" $endpoint -}}{{- fail "search endpoint URLs must not contain credentials; use Secret references" -}}{{- end -}}
{{- end -}}
{{- if and $s.username $s.usernameSecretRef -}}{{- fail "search username and usernameSecretRef are mutually exclusive" -}}{{- end -}}
{{- $basic := or $s.username $s.usernameSecretRef -}}
{{- if ne (not (empty $basic)) (not (empty $s.passwordSecretRef)) -}}{{- fail "search username and passwordSecretRef must be configured together" -}}{{- end -}}
{{- if and $s.apiKeySecretRef $basic -}}{{- fail "search apiKeySecretRef cannot be combined with basic authentication" -}}{{- end -}}
{{- end -}}
{{- with $settings.kafka -}}
{{- if gt (int (default 2 .minInSyncReplicas)) (int (default 3 .replicationFactor)) -}}{{- fail "Kafka minInSyncReplicas cannot exceed replicationFactor" -}}{{- end -}}
{{- $runtime := default dict .runtime -}}
{{- $topic := default dict $runtime.topic -}}
{{- if or (hasKey $topic "name") (hasKey $topic "partitions") (hasKey $topic "replication_factor") (hasKey $topic "min_insync_replicas") (hasKey (default dict $runtime.consumer) "group_id") -}}{{- fail "Kafka identity and replication policy are chart-managed" -}}{{- end -}}
{{- end -}}
{{- end -}}
{{- range $component := include "sink.components" . | fromJsonArray -}}
{{- if ne $component.role "gateway" -}}
{{- if or (hasKey $component.settings.runtime.grpc "address") (hasKey (default dict $component.settings.runtime.service.request) "timeout") -}}{{- fail "Store listeners and request timeout are chart-managed" -}}{{- end -}}
{{- end -}}
{{- end -}}
