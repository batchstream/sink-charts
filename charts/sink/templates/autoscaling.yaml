{{- range $component := include "sink.components" . | fromJsonArray }}
{{- $c := merge (dict "root" $) $component }}
{{- $a := $c.settings.autoscaling }}
{{- $name := include "sink.componentName" $c }}
{{- if eq $a.mode "hpa" }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels: {{ include "sink.labels" $c | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $name }}}
  minReplicas: {{ $a.minReplicas }}
  maxReplicas: {{ $a.maxReplicas }}
  behavior: {{ include "sink.behavior" $a | nindent 4 }}
  metrics:
    {{- if gt (int $a.targetCPUUtilizationPercent) 0 }}
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $a.targetCPUUtilizationPercent }}}
    {{- end }}
    {{- if gt (int $a.targetMemoryUtilizationPercent) 0 }}
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: {{ $a.targetMemoryUtilizationPercent }}}
    {{- end }}
    {{- with $a.extraMetrics }}{{ toYaml . | nindent 4 }}{{- end }}
{{- else if eq $a.mode "keda" }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $name }}
  labels: {{ include "sink.labels" $c | nindent 4 }}
  {{- with $a.keda.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef: {name: {{ $name }}}
  minReplicaCount: {{ $a.minReplicas }}
  maxReplicaCount: {{ $a.maxReplicas }}
  {{- $cached := and (eq $c.role "worker") $a.keda.kafkaLag.useCachedMetrics }}
  {{- range $trigger := $a.keda.triggers }}{{- if $trigger.useCachedMetrics }}{{- $cached = true }}{{- end }}{{- end }}
  {{- if or (eq (int $a.minReplicas) 0) $cached }}
  pollingInterval: {{ $a.keda.pollingInterval }}
  {{- end }}
  {{- if eq (int $a.minReplicas) 0 }}
  cooldownPeriod: {{ $a.keda.cooldownPeriod }}
  {{- if gt (int $a.keda.initialCooldownPeriod) 0 }}
  initialCooldownPeriod: {{ $a.keda.initialCooldownPeriod }}
  {{- end }}
  {{- end }}
  {{- with $a.keda.fallback }}
  fallback: {{ toYaml . | nindent 4 }}
  {{- end }}
  advanced:
    {{- if $a.keda.restoreToOriginalReplicaCount }}
    restoreToOriginalReplicaCount: true
    {{- end }}
    horizontalPodAutoscalerConfig:
      {{- with $a.keda.hpaName }}
      name: {{ . | quote }}
      {{- end }}
      behavior: {{ include "sink.behavior" $a | nindent 8 }}
  triggers:
    {{- if eq $c.role "worker" }}
    - type: kafka
      {{- with $a.keda.kafkaLag.name }}
      name: {{ . | quote }}
      {{- end }}
      metricType: AverageValue
      {{- if $a.keda.kafkaLag.useCachedMetrics }}
      useCachedMetrics: true
      {{- end }}
      metadata:
        bootstrapServers: {{ join "," $c.kafka.brokers | quote }}
        consumerGroup: {{ $c.settings.config.kafkaConsumer.groupId | quote }}
        topic: {{ $c.kafka.topic.name | quote }}
        lagThreshold: {{ $a.keda.kafkaLag.targetLag | quote }}
        activationLagThreshold: "0"
        offsetResetPolicy: earliest
        allowIdleConsumers: "false"
        scaleToZeroOnInvalidOffset: "false"
        excludePersistentLag: "false"
      {{- with $a.keda.kafkaLag.authenticationRef }}
      authenticationRef: {{ toYaml . | nindent 8 }}
      {{- end }}
    {{- else if eq (len $a.keda.triggers) 0 }}
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ $a.targetCPUUtilizationPercent | quote }}
    {{- end }}
    {{- with $a.keda.triggers }}{{ toYaml . | nindent 4 }}{{- end }}
{{- end }}
{{- end }}
