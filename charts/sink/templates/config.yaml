{{- $inventoryName := include "sink.name" (dict "raw" (printf "%s-inventory" (include "sink.base" .))) }}
{{- $previous := dict }}
{{- $hasInventory := false }}
{{- if .Values.cluster.storeLifecycle.enforceTransitions }}
{{- $inventory := lookup "v1" "ConfigMap" .Release.Namespace $inventoryName }}
{{- if $inventory }}{{- $previous = fromJson $inventory.data.stores }}{{- $hasInventory = true }}{{- end }}
{{- end }}
{{- $current := dict }}
{{- $topics := dict }}{{- $groups := dict }}
{{- range $store, $settings := .Values.stores }}
{{- $engine := mergeOverwrite (deepCopy $.Values.defaults.engine) (default dict $settings.engine) }}
{{- $worker := mergeOverwrite (deepCopy $.Values.defaults.worker) (default dict $settings.worker) }}
{{- $kafka := dict }}
{{- with $settings.kafka }}
{{- $policy := dict "partitions" .topicPolicy.partitions "replicationFactor" (default 3 .topicPolicy.replicationFactor) "minInSyncReplicas" (default 1 .topicPolicy.minInSyncReplicas) }}
{{- $deadLetter := default (printf "%s.dlq" (trim .topic.name)) (dig "deadLetterTopic" "name" "" .) }}
{{- $kafka = dict "brokers" .brokers "topic" .topic.name "topicPolicy" $policy "deadLetterTopic" $deadLetter "consumerGroup" (default "" $worker.config.kafkaConsumer.groupId) }}
{{- end }}
{{- $engineConfig := include "sink.roleConfig" (dict "root" $ "role" "engine" "store" $store "settings" $engine "storage" $settings.storage "kafka" (default dict $settings.kafka)) }}
{{- $entry := dict "phase" $settings.phase "kafka" $kafka "workerEnabled" $worker.enabled "engineHash" (toJson (dict "engine" $engine "storage" $settings.storage "maxConcurrent" (default 0 $settings.maxConcurrent) "kafkaRuntime" (default dict $settings.kafka) "credentialRevision" (default "" $settings.credentialRevision) "runtime" $engineConfig "image" $.Values.image "discovery" $.Values.cluster.discovery) | sha256sum) }}
{{- $_ := set $current $store $entry }}
{{- if $kafka }}
{{- range $pair := list (dict "name" "topic" "value" $kafka.topic "seen" $topics) (dict "name" "deadLetterTopic" "value" $kafka.deadLetterTopic "seen" $topics) (dict "name" "consumerGroup" "value" $kafka.consumerGroup "seen" $groups) }}
{{- $identity := trim $pair.value }}
{{- if $identity }}
{{- if hasKey $pair.seen $identity }}{{- fail (printf "Kafka %s must be unique per Store" $pair.name) }}{{- end }}
{{- $_ := set $pair.seen $identity true }}
{{- end }}
{{- end }}
{{- end }}
{{- if $hasInventory }}
{{- $old := get $previous $store }}
{{- if not $old }}
{{- if ne $settings.phase "staged" }}{{- fail (printf "new Store %s must first be staged" $store) }}{{- end }}
{{- else }}
{{- if ne (toJson $old.kafka) (toJson $kafka) }}{{- fail (printf "Store %s Kafka identity/policy is immutable; drain and migrate explicitly" $store) }}{{- end }}
{{- if and (ne $old.phase "staged") (eq $settings.phase "staged") }}{{- fail "previously routed Stores cannot return to staged; use retiring" }}{{- end }}
{{- if and $old.workerEnabled (not $worker.enabled) (not (and (eq $settings.phase "retiring") (has $store $.Values.cluster.storeLifecycle.removalApprovals))) }}{{- fail "disabling a Worker requires retiring and an explicit removalApproval after draining" }}{{- end }}
{{- if and (eq $settings.phase "active") (ne $old.phase "active") }}
{{- if ne $old.engineHash $entry.engineHash }}{{- fail (printf "Store %s activation must be a separate upgrade after Engine configuration converges" $store) }}{{- end }}
{{- $engineName := include "sink.componentName" (dict "root" $ "role" "engine" "store" $store) }}
{{- $deployment := lookup "apps/v1" "Deployment" $.Release.Namespace $engineName }}
{{- $status := default dict $deployment.status }}
{{- $spec := default dict $deployment.spec }}
{{- $minimum := int $engine.replicas }}
{{- if ne $engine.autoscaling.mode "none" }}{{- $minimum = int $engine.autoscaling.minReplicas }}{{- end }}
{{- $desired := max $minimum (int (default 1 $spec.replicas)) }}
{{- if or (not $deployment) (lt (int (default 0 $status.observedGeneration)) (int $deployment.metadata.generation)) (lt (int (default 0 $status.availableReplicas)) (int $desired)) (ne (int (default 0 $status.updatedReplicas)) (int $desired)) }}{{- fail (printf "Store %s Engine is not fully available; wait before activating" $store) }}{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $store, $old := $previous }}
{{- if not (hasKey $current $store) }}
{{- if eq $old.phase "active" }}{{- fail (printf "Store %s must be retiring before removal" $store) }}{{- end }}
{{- if not (has $store $.Values.cluster.storeLifecycle.removalApprovals) }}{{- fail (printf "Store %s removal requires cluster.storeLifecycle.removalApprovals after writer/Kafka/DLQ drain" $store) }}{{- end }}
{{- if eq $old.phase "retiring" }}
{{- $gatewayName := include "sink.componentName" (dict "root" $ "role" "gateway" "store" "") }}
{{- $gateway := lookup "apps/v1" "Deployment" $.Release.Namespace $gatewayName }}
{{- $pods := lookup "v1" "Pod" $.Release.Namespace "" }}
{{- range $pod := default list $pods.items }}
{{- $labels := default dict $pod.metadata.labels }}
{{- if and (eq (get $labels "app.kubernetes.io/instance") $.Release.Name) (eq (get $labels "app.kubernetes.io/component") "gateway") }}
{{- $expected := include "sink.gatewayConfig" $ | sha256sum }}
{{- if or $pod.metadata.deletionTimestamp (not $gateway) (ne (get (default dict $pod.metadata.annotations) "sink.batchstream.io/config-checksum") $expected) }}{{- fail (printf "Store %s still has old or terminating Gateway Pods; wait before removal" $store) }}{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $inventoryName }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  stores: {{ toJson $current | quote }}
{{- $active := false }}
{{- range .Values.stores }}{{- if eq .phase "active" }}{{- $active = true }}{{- end }}{{- end }}
{{- if $active }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sink.componentName" (dict "root" . "role" "gateway" "store" "") }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  sink.yaml: |
    {{- include "sink.gatewayConfig" . | nindent 4 }}
{{- end }}

{{- range $component := include "sink.components" . | fromJsonArray }}
{{- if ne $component.role "gateway" }}
{{- $c := merge (dict "root" $) $component }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sink.componentName" $c }}
  labels:
    {{- include "sink.labels" $c | nindent 4 }}
data:
  sink.yaml: |
    {{- include "sink.roleConfig" $c | nindent 4 }}
{{- end }}
{{- end }}

{{- range $store, $settings := .Values.stores }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sink.componentName" (dict "root" $ "role" "store" "store" $store) }}
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
data:
  store.yaml: |
    {{- include "sink.storeConfig" (dict "store" $store "storage" $settings.storage "maxConcurrent" (default 0 $settings.maxConcurrent) "kafka" (default dict $settings.kafka)) | nindent 4 }}
{{- end }}
