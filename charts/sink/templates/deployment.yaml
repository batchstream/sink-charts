{{- range $component := include "sink.components" . | fromJsonArray }}
{{- $c := merge (dict "root" $) $component }}
{{- $s := $c.settings }}
{{- $image := $.Values.image }}
{{- $name := include "sink.componentName" $c }}
{{- $preStop := include "sink.preStop" $c | int }}
{{- $readySeconds := int $s.rollout.minReadySeconds }}
{{- if eq $c.role "engine" }}{{- $readySeconds = max $readySeconds (include "sink.discoverySeconds" $ | int) }}{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "sink.labels" $c | nindent 4 }}
spec:
  {{- if eq $s.autoscaling.mode "none" }}
  replicas: {{ $s.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  minReadySeconds: {{ $readySeconds }}
  progressDeadlineSeconds: {{ max 600 (add $readySeconds (include "sink.grace" $c | int) 300) }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "sink.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sink.selector" $c | nindent 8 }}
        {{- with $s.pod.labels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        sink.batchstream.io/config-revision: {{ $s.rollout.restartRevision | quote }}
        {{- if eq $c.role "gateway" }}
        sink.batchstream.io/config-checksum: {{ include "sink.gatewayConfig" $ | sha256sum | quote }}
        {{- else }}
        sink.batchstream.io/config-checksum: {{ printf "%s\n%s" (include "sink.roleConfig" $c) (include "sink.storeConfig" $c) | sha256sum | quote }}
        sink.batchstream.io/credential-revision: {{ $c.credentialRevision | quote }}
        {{- end }}
        {{- with $s.pod.annotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ include "sink.grace" $c }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.pod.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with $s.pod.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.pod.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $s.pod.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- if $s.pod.topologySpreadConstraints }}
        {{- toYaml $s.pod.topologySpreadConstraints | nindent 8 }}
        {{- else }}
        {{- range $topology := list "kubernetes.io/hostname" "topology.kubernetes.io/zone" }}
        - maxSkew: 1
          topologyKey: {{ $topology }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "sink.selector" $c | nindent 14 }}
        {{- end }}
        {{- end }}
      containers:
        - name: sink
          image: {{ if $image.digest }}{{ printf "%s@%s" $image.repository $image.digest | quote }}{{ else }}{{ printf "%s:%s" $image.repository $image.tag | quote }}{{ end }}
          imagePullPolicy: {{ $image.pullPolicy }}
          args: ["--config", "/etc/sink/sink.yaml"{{ if ne $c.role "gateway" }}, "--store-config", "/etc/sink/store.yaml"{{ end }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: health, containerPort: 8081}
            {{- if ne $c.role "worker" }}
            - {name: grpc, containerPort: 8080}
            {{- end }}
            {{- if $.Values.metrics.enabled }}
            - {name: metrics, containerPort: 9090}
            {{- end }}
          env:
            - name: GOMEMLIMIT
              value: {{ printf "%d" (div (mul (include "sink.memoryBytes" $s.pod.resources.limits.memory | int64) $s.pod.goMemoryLimitPercent) 100) | quote }}
            {{- $customEnv := dict }}
            {{- range $s.pod.env }}{{- $_ := set $customEnv .name true }}{{- end }}
            {{- range $name, $field := dict "POD_UID" "metadata.uid" "POD_NAME" "metadata.name" "POD_NAMESPACE" "metadata.namespace" "NODE_NAME" "spec.nodeName" }}
            {{- if not (hasKey $customEnv $name) }}
            - name: {{ $name }}
              valueFrom:
                fieldRef:
                  fieldPath: {{ $field }}
            {{- end }}
            {{- end }}
            {{- with $s.pod.env }}{{ toYaml . | nindent 12 }}{{- end }}
          {{- with $s.pod.envFrom }}
          envFrom: {{ toYaml . | nindent 12 }}
          {{- end }}
          resources: {{ toYaml $s.pod.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /livez, port: health}
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /livez, port: health}
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          readinessProbe:
            httpGet:
              {{- if and (eq $c.role "engine") (ne $s.rollout.readinessCheck "process") }}
              path: {{ printf "/readyz?service=sink.%s.%s" $s.rollout.readinessCheck $c.store | quote }}
              {{- else }}
              path: /readyz
              {{- end }}
              port: health
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 1
          {{- if gt $preStop 0 }}
          lifecycle:
            preStop:
              sleep: {seconds: {{ $preStop }}}
          {{- end }}
          volumeMounts:
            - {name: config, mountPath: /etc/sink, readOnly: true}
            {{- if and (ne $c.role "gateway") (ne (include "sink.secretSources" $c) "[]") }}
            - {name: credentials, mountPath: /etc/sink-secrets, readOnly: true}
            {{- end }}
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: {{ $name }}
              {{- if ne $c.role "gateway" }}
              - configMap:
                  name: {{ include "sink.componentName" (dict "root" $ "role" "store" "store" $c.store) }}
              {{- end }}
        {{- if ne $c.role "gateway" }}
        {{- $sources := include "sink.secretSources" $c | fromJsonArray }}
        {{- if $sources }}
        - name: credentials
          projected:
            defaultMode: 0440
            sources:
              {{- toYaml $sources | nindent 14 }}
        {{- end }}
        {{- end }}
{{- end }}
