name: Charts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint, test rendering, and package
        run: make check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Validate Kubernetes resource schemas
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          helm template sink ./charts/sink --kube-version 1.30.0 \
            -f examples/cluster-values.yaml -f examples/logging-values.yaml --set metrics.enabled=true \
            | kubeconform -strict -summary -kubernetes-version 1.30.0
      - name: Check complete configurations with released Sink
        run: python tests/check_runtime.py

  qualification:
    name: Kubernetes qualification (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        scenario: [all, upgrades]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install qualification tools
        run: |
          python -m pip install -r requirements-dev.txt
          go install sigs.k8s.io/kind@v0.33.0
      - name: Qualify rollouts, Store lifecycle and KEDA with business traffic
        run: make integration SCENARIO=${{ matrix.scenario }}
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kubernetes-qualification-${{ matrix.scenario }}
          path: .reports/
          include-hidden-files: true

  integration:
    if: always()
    needs: qualification
    runs-on: ubuntu-latest
    steps:
      - name: Require both Kubernetes qualification scenarios
        env:
          RESULT: ${{ needs.qualification.result }}
        run: test "$RESULT" = success
