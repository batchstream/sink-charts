name: Charts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-server:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - id: resolve
        env:
          CANDIDATE_REF: ${{ github.head_ref || 'main' }}
        run: |
          remote=https://github.com/batchstream/sink.git
          revision=$(git ls-remote --heads "$remote" "refs/heads/$CANDIDATE_REF" | awk '{print $1}')
          if [[ -z "$revision" ]]; then
            revision=$(git ls-remote --heads "$remote" refs/heads/main | awk '{print $1}')
          fi
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve-server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint, test rendering, and package
        run: make check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Compile business probe against the released SDK
        run: go -C tests/integration/probe build -mod=readonly -o "$RUNNER_TEMP/sink-chart-probe" .
      - name: Validate Kubernetes resource schemas
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          helm template sink ./charts/sink --kube-version 1.30.0 \
            -f examples/cluster-values.yaml -f examples/logging-values.yaml --set metrics.enabled=true \
            | kubeconform -strict -summary -kubernetes-version 1.30.0
      - name: Check out matching Sink candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: batchstream/sink
          path: sink-candidate
          ref: ${{ needs.resolve-server.outputs.revision }}
      - name: Check generated files with candidate parser
        run: |
          go -C sink-candidate build -o "$RUNNER_TEMP/sink" ./cmd/sink
          python tests/check_runtime.py --sink-binary "$RUNNER_TEMP/sink"


  qualification:
    needs: resolve-server
    name: Kubernetes qualification (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        scenario: [all, upgrades]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install qualification tools
        run: |
          python -m pip install -r requirements-dev.txt
          go install sigs.k8s.io/kind@v0.33.0
      - name: Check out matching Sink candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: batchstream/sink
          path: sink-candidate
          ref: ${{ needs.resolve-server.outputs.revision }}
      - name: Build compatible rollout candidates
        run: |
          docker build --build-arg VERSION=chart-candidate-a -t sink-chart-candidate:a sink-candidate
          docker build --build-arg VERSION=chart-candidate-b -t sink-chart-candidate:b sink-candidate
      - name: Qualify rollouts, Store lifecycle and KEDA with business traffic
        run: python tests/integration/run.py --scenario ${{ matrix.scenario }} --sink-image sink-chart-candidate:a --upgrade-image sink-chart-candidate:b

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kubernetes-qualification-${{ matrix.scenario }}
          path: .reports/
          include-hidden-files: true

  integration:
    if: always()
    needs: qualification
    runs-on: ubuntu-latest
    steps:
      - name: Require both Kubernetes qualification scenarios
        env:
          RESULT: ${{ needs.qualification.result }}
        run: test "$RESULT" = success
