apiVersion: v1
kind: Service
metadata: {name: mongo}
spec:
  selector: {test-backend: mongo}
  ports: [{port: 27017}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mongo}
spec:
  replicas: 1
  selector: {matchLabels: {test-backend: mongo}}
  template:
    metadata: {labels: {test-backend: mongo}}
    spec:
      initContainers:
        - name: internal-auth
          image: mongo:8.2@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
          command: ["sh", "-c", "printf 'syntheticInternalAuthenticationForDisposableTestsOnly' > /auth/internal-auth; chmod 400 /auth/internal-auth; chown 999:999 /auth/internal-auth"]
          volumeMounts: [{name: auth, mountPath: /auth}]
      containers:
        - name: mongo
          image: mongo:8.2@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
          args: ["--keyFile", "/auth/internal-auth", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          env: [{name: GLIBC_TUNABLES, value: "glibc.pthread.rseq=1"}]
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 768Mi}
          readinessProbe:
            tcpSocket: {port: 27017}
            periodSeconds: 2
          volumeMounts: [{name: data, mountPath: /data/db}, {name: auth, mountPath: /auth, readOnly: true}]
      volumes: [{name: data, emptyDir: {}}, {name: auth, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: kafka}
spec:
  selector: {test-backend: kafka}
  ports: [{port: 9092}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka}
spec:
  replicas: 1
  selector: {matchLabels: {test-backend: kafka}}
  template:
    metadata: {labels: {test-backend: kafka}}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.2.1@sha256:9916d60eca5d599550e2c320230808fda342124ba550bb4ac4ea8591803262a0
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx384m"}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 768Mi}
          readinessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 2
